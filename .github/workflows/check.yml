name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Compile pinned Java reference
        run: |
          curl -L --fail https://codeload.github.com/KosherJava/zmanim/tar.gz/04dc83975db43582414d8639e0e204d9681aa6f0 -o /tmp/java-source.tar.gz
          mkdir -p /tmp/java-source /tmp/java-classes
          tar -xzf /tmp/java-source.tar.gz -C /tmp/java-source --strip-components=1
          javac -d /tmp/java-classes $(find /tmp/java-source/src/main/java -name '*.java') scripts/KosherJavaReference.java
      - run: npm test
        env:
          KOSHERJAVA_CLASSPATH: /tmp/java-classes
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: luach-plus-${{ runner.os }}
          path: src-tauri/target/release/bundle/
